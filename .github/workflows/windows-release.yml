name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements-build.txt

      - name: Run tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -p "test_*.py"

      - name: Build Windows executable
        working-directory: python
        env:
          PYTHONPATH: .
        run: pyinstaller --noconfirm convertaderta.spec

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item python/dist/convertaderta.exe dist/windows/convertaderta.exe
          Compress-Archive -Path dist/windows/convertaderta.exe -DestinationPath dist/convertaderta-windows.zip -Force

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/convertaderta-windows.zip

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: convertaderta-windows
          path: dist/convertaderta-windows.zip
